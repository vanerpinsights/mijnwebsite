# Netlify bouwt de site bij elke push naar GitHub en publiceert de map dist/.
[build]
  command = "python3 build.py"
  publish = "dist"


# Lange cache voor afbeeldingen en fonts, kortere voor CSS
[[headers]]
  for = "/assets/img/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000"
[[headers]]
  for = "/assets/fonts/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
